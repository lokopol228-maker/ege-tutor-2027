services:
  - type: web
    name: ege-tutor-2027
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node scripts/start.mjs
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Локальный SQLite — без Render Postgres (она у тебя не поднималась)
      - key: DATABASE_URL
        value: file:./prisma/data/prod.db
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Ученик
